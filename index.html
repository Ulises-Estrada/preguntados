<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Preguntados</title>
</head>

<body>
  <header class="main-header">
    <h1 class="header-title">Comenzar a Jugar</h1>
  </header>
  <main class="general-container">
    <div class="players-container">
      <div class="player-stats-container">
        <span class="player-name">Jugador 1</span>
        <span class="player-points-one">Puntos: 0</span>
        <span class="player-mistakes-one">Errores: 0</span>
      </div>
    </div>

    <div class="marker"></div>
    <div class="square-container">
      <div data-category="competiciones" class="standard square-one competiciones"></div>
      <div data-category="jugadores" class="standard square-two jugadores"></div>
      <div data-category="reglamento" class="standard square-three reglamento"></div>
      <div data-category="historia" class="standard square-four historia"></div>
      <div data-category="fichajes" class="standard square-five fichajes"></div>
      <div data-category="cultura" class="standard square-six cultura"></div>
    </div>
    <div class="options-container">
      <div class="rules">Reglas</div>
      <div class="category-container">
        <span class="color-category com"></span>
        <span class="name-category">Competiciones y Torneos</span>
      </div>
      <div class="category-container">
        <span class="color-category jug"></span>
        <span class="name-category">Jugadores, Leyendas y Entrenadores</span>
      </div>
      <div class="category-container">
        <span class="color-category reg"></span>
        <span class="name-category">Reglamento, Táctica y Estilos de Juego</span>
      </div>
      <div class="category-container">
        <span class="color-category his"></span>
        <span class="name-category">Historia y Momentos Icónicos</span>
      </div>
      <div class="category-container">
        <span class="color-category fic"></span>
        <span class="name-category">Fichajes, Negocios y Estructura Institucional</span>
      </div>
      <div class="category-container">
        <span class="color-category cul"></span>
        <span class="name-category">Cultura, Rivalidades y Folclore Futbolero</span>
      </div>
    </div>
  </main>
  <div class="question-container">
  </div>
  <div class="final-result-container">

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
