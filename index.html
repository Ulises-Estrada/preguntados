<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Preguntados</title>
</head>

<body>

  <header class="main-header">
    <h1 id="header-title">Preguntoon</h1>
    <!--<div id="header-button-play">-->
    <span id="header-play">Comenzar a Jugar</span>
    <!--</div>-->
  </header>

  <main class="general-container">
    <div class="players-container">
      <div class="player-stats-container">
        <span class="player-name">Jugador 1</span>
        <span class="player-points-one">Puntos: 0</span>
        <span class="player-mistakes-one">Errores: 0</span>
      </div>
    </div>

    <div class="roulette-stage">
      <div class="roulette-wrapper">
        <div class="marker"></div>
        <div class="square-container">
          <div data-category="competiciones" class="standard square-one competiciones">
            <img src="img/Competición y torneos.png" alt="Competiciones y torneos" class="square-one-img">
          </div>
          <div data-category="jugadores" class="standard square-two jugadores">
            <img src="img/Jugadores, leyendas y entrenadores.png" alt="Jugadores, leyendas y entrenadores"
              class="square-two-img">
          </div>
          <div data-category="reglamento" class="standard square-three reglamento">
            <img src="img/Reglamento táctica y estilos de juego.png" alt="Reglamento táctica y estilos de juego"
              class="square-three-img">
          </div>
          <div data-category="historia" class="standard square-four historia">
            <img src="img/historia y momentos Icónicos.png" alt="Historia y momentos Icónicos" class="square-four-img">
          </div>
          <div data-category="fichajes" class="standard square-five fichajes">
            <img src="img/Fichajes, negocios y estructura Institucional.png"
              alt="Fichajes, negocios y estructura Institucional" class="square-five-img">
          </div>
          <div data-category="cultura" class="standard square-six cultura">
            <img src="img/cultura, rivalidades y folclore futbolero.png" alt="Cultura, rivalidades y folclore futbolero"
              class="square-six-img">
          </div>
        </div>
      </div>
    </div>
    <div class="options-container">
      <!--<div class="rules">Reglas</div>-->
      <div class="category-container">
        <span class="color-category com"></span>
        <span class="name-category">Competiciones y Torneos</span>
      </div>
      <div class="category-container">
        <span class="color-category jug"></span>
        <span class="name-category">Jugadores, Leyendas y Entrenadores</span>
      </div>
      <div class="category-container">
        <span class="color-category reg"></span>
        <span class="name-category">Reglamento, Táctica y Estilos de Juego</span>
      </div>
      <div class="category-container">
        <span class="color-category his"></span>
        <span class="name-category">Historia y Momentos Icónicos</span>
      </div>
      <div class="category-container">
        <span class="color-category fic"></span>
        <span class="name-category">Fichajes, Negocios y Estructura Institucional</span>
      </div>
      <div class="category-container">
        <span class="color-category cul"></span>
        <span class="name-category">Cultura, Rivalidades y Folclore Futbolero</span>
      </div>
    </div>
  </main>

  <div class="question-container">
  </div>

  <div class="final-result-container">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
